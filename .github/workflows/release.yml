name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "pypi"
        type: choice
        options:
          - pypi
          - testpypi

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_FROZEN: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Build & verify the distribution artifacts.
  # ---------------------------------------------------------------------------
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          project_version=$(uv run python -c "from wallstrank import __version__; print(__version__)")
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Project version: $project_version"
          echo "Tag version:     $tag_version"
          if [ "$project_version" != "$tag_version" ]; then
            echo "::error::Tag $tag_version does not match project version $project_version"
            exit 1
          fi

      - name: Run tests
        run: uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish to TestPyPI (manual dispatch only).
  # ---------------------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/wallstrank-py
    permissions:
      id-token: write # required for OIDC / trusted publishing
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          print-hash: true

  # ---------------------------------------------------------------------------
  # Publish to PyPI on tag pushes or manual pypi dispatch.
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wallstrank-py
    permissions:
      id-token: write # required for OIDC / trusted publishing
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true

  # ---------------------------------------------------------------------------
  # Create a GitHub Release with auto-generated notes on tag pushes.
  # ---------------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create releases
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
